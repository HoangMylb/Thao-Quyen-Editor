services:
  - type: web
    name: thaoquyen-editor-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: JwtSettings__SecretKey
        generateValue: true
      - key: JwtSettings__Issuer
        value: ThaoQuyenEditor
      - key: JwtSettings__Audience
        value: ThaoQuyenEditorClient
